; Pools php-fpm de NavUp (modèle, étape 8) : un par API, chacun enfermé dans ses dossiers (open_basedir).
; À placer dans /etc/php-fpm.d/. Utilisateur système dédié « navup », groupe apache.

[navup]
user = navup
group = apache
listen = /run/php-fpm/navup.sock
listen.owner = apache
listen.group = apache
listen.mode = 0660
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
php_admin_value[open_basedir] = /var/www/navup-api:/var/www/navup-media:/tmp
php_admin_value[upload_max_filesize] = 9M
php_admin_value[post_max_size] = 9M
php_admin_value[memory_limit] = 256M
php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/log/php-fpm/navup-erreurs.log
php_admin_value[disable_functions] = passthru,system,proc_open,popen,pcntl_exec
; exec et shell_exec restent permis : conversion des médias (ffmpeg, pdftoppm)

[navup-parents]
user = navup-parents
group = apache
listen = /run/php-fpm/navup-parents.sock
listen.owner = apache
listen.group = apache
listen.mode = 0660
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
php_admin_value[open_basedir] = /var/www/navup-parent-api:/var/www/navup-media:/tmp
php_admin_value[post_max_size] = 64K
php_admin_value[memory_limit] = 128M
php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/log/php-fpm/navup-parents-erreurs.log
php_admin_value[disable_functions] = exec,shell_exec,passthru,system,proc_open,popen,pcntl_exec
