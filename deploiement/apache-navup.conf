# NavUp : les quatre sites (modèle, étape 8). Adresses proposées, à confirmer au choix de l'hébergement :
#   tour.navup.fr        Tour de contrôle (navup-front, statique)
#   api.navup.fr         navup-api (PHP, pool php-fpm « navup »)
#   espace.navup.fr      appli des parents (navup-parent-front, statique prérendu)
#   api-espace.navup.fr  navup-parent-api (PHP, pool php-fpm « navup-parents »)
# Certificats : certbot (Let's Encrypt). Le port 80 ne sert qu'à rediriger vers HTTPS.
# Journal : sans la chaîne de requête (elle peut porter un identifiant), voir LogFormat « navup ».

LogFormat "%h %l %u %t \"%m %U %H\" %>s %b %D" navup

<VirtualHost *:80>
    ServerName tour.navup.fr
    ServerAlias api.navup.fr espace.navup.fr api-espace.navup.fr
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# Réglages communs aux quatre sites HTTPS
<Macro NavupTls $nom>
    ServerName $nom
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/$nom/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/$nom/privkey.pem
    Protocols h2 http/1.1
    Header always set Strict-Transport-Security "max-age=31536000"
    ServerSignature Off
    CustomLog /var/log/httpd/navup-$nom.log navup
    ErrorLog /var/log/httpd/navup-$nom-erreurs.log
</Macro>

<VirtualHost *:443>
    Use NavupTls tour.navup.fr
    DocumentRoot /var/www/navup-front/browser
    SetEnv NAVUP_CONNECT "https://api.navup.fr"
    <Directory /var/www/navup-front/browser>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    Use NavupTls espace.navup.fr
    DocumentRoot /var/www/navup-parent-front/browser
    SetEnv NAVUP_CONNECT "https://api.navup.fr https://api-espace.navup.fr"
    <Directory /var/www/navup-parent-front/browser>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    Use NavupTls api.navup.fr
    # Seul v1/ est servi : include/, require/, script-cgi/, sql/ et deploiement/ restent hors d'atteinte
    DocumentRoot /var/www/navup-api/v1
    Alias /v1 /var/www/navup-api/v1
    <Directory /var/www/navup-api/v1>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php-fpm/navup.sock|fcgi://localhost"
    </FilesMatch>
    # Téléversement par morceaux (formation) : 8 Mo par morceau au plus
    LimitRequestBody 9437184
</VirtualHost>

<VirtualHost *:443>
    Use NavupTls api-espace.navup.fr
    DocumentRoot /var/www/navup-parent-api/v1
    Alias /v1 /var/www/navup-parent-api/v1
    <Directory /var/www/navup-parent-api/v1>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php-fpm/navup-parents.sock|fcgi://localhost"
    </FilesMatch>
    LimitRequestBody 65536
</VirtualHost>

UndefMacro NavupTls
